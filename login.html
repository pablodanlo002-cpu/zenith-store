<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Zenith Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .login-box {
            background: #111;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo img {
            height: 40px;
            margin-bottom: 0.5rem;
        }

        .logo h1 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 2rem;
            text-align: center;
            color: #8b5cf6;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #aaa;
        }

        input {
            width: 100%;
            padding: 0.9rem;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #8b5cf6;
        }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: #8b5cf6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }

        .btn-primary:hover {
            background: #7c3aed;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 2rem 0;
            color: #666;
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #333;
        }

        .divider span {
            padding: 0 1rem;
        }

        .social-btns {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            padding: 0.9rem;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-social:hover {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.1);
        }

        .btn-social img {
            width: 20px;
            height: 20px;
        }

        .links {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
        }

        .links a {
            color: #8b5cf6;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .forgot {
            text-align: right;
            margin-top: 0.5rem;
        }

        .forgot a {
            color: #888;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .forgot a:hover {
            color: #8b5cf6;
        }
    </style>
</head>
<body>
    <script src="notifications.js"></script>
    <div class="login-box">
        <div class="logo">
            <img src="images/logo/logo.png" alt="Zenith Store" style="height: 40px; margin-bottom: 0.5rem;">
            <h1 style="font-size: 1.2rem; font-weight: 700;">ZENITH STORE</h1>
        </div>

        <h2>Connexion</h2>

        <form id="loginForm" onsubmit="login(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" required>
            </div>

            <div class="forgot">
                <a href="reset-password.html">Mot de passe oublié ?</a>
            </div>

            <button type="submit" class="btn-primary">Se connecter</button>
        </form>

        <div class="divider">
            <span>ou continuer avec</span>
        </div>

        <div class="social-btns">
            <button class="btn-social" onclick="loginGoogle()">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285f4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#fbbc05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Google
            </button>

            <button class="btn-social" onclick="loginFacebook()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877f2">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
                Facebook
            </button>

            <button class="btn-social" onclick="loginApple()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff">
                    <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                </svg>
                Apple
            </button>

            <button class="btn-social" onclick="loginGithub()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                GitHub
            </button>
        </div>

        <div class="links">
            <p>Pas encore de compte ? <a href="register.html">S'inscrire</a></p>
            <p style="margin-top: 1rem;"><a href="index.html">Retour à l'accueil</a></p>
        </div>
    </div>

    <script>
        function login(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.toLowerCase().trim();
            const password = document.getElementById('password').value;
            
            const users = JSON.parse(localStorage.getItem('users')) || [];
            const user = users.find(u => u.email === email && u.password === password);
            
            if (!user) {
                showNotification('Échec de connexion', 'Email ou mot de passe incorrect', 'error');
                return;
            }
            
            // Vérifier si l'utilisateur est banni
            if (user.banned) {
                showNotification('Accès refusé', 'Ton compte a été banni par un administrateur.\n\nContacte le support si tu penses qu\'il s\'agit d\'une erreur.', 'ban');
                return;
            }
            
            // Vérifier si l'email est confirmé
            if (user.emailConfirmed === false) {
                showNotification('Email non confirmé', 'Un email de confirmation a été envoyé à ' + email + '\n\nClique sur le lien dans l\'email pour activer ton compte.', 'warning');
                return;
            }
            
            localStorage.setItem('currentUser', JSON.stringify(user));
            showNotification('Connexion réussie', 'Bienvenue ' + (user.name || 'sur Zenith Store') + ' !', 'success');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }

        function loginGoogle() {
            // Simulation - En prod, utiliser Firebase Auth ou Google OAuth
            const user = {
                id: Date.now(),
                name: 'Utilisateur Google',
                email: 'user@gmail.com',
                provider: 'google'
            };
            localStorage.setItem('currentUser', JSON.stringify(user));
            alert('Connecté avec Google !');
            window.location.href = 'index.html';
        }

        function loginFacebook() {
            const user = {
                id: Date.now(),
                name: 'Utilisateur Facebook',
                email: 'user@facebook.com',
                provider: 'facebook'
            };
            localStorage.setItem('currentUser', JSON.stringify(user));
            alert('Connecté avec Facebook !');
            window.location.href = 'index.html';
        }

        function loginApple() {
            const user = {
                id: Date.now(),
                name: 'Utilisateur Apple',
                email: 'user@icloud.com',
                provider: 'apple'
            };
            localStorage.setItem('currentUser', JSON.stringify(user));
            alert('Connecté avec Apple !');
            window.location.href = 'index.html';
        }

        function loginGithub() {
            const user = {
                id: Date.now(),
                name: 'Utilisateur GitHub',
                email: 'user@github.com',
                provider: 'github'
            };
            localStorage.setItem('currentUser', JSON.stringify(user));
            alert('Connecté avec GitHub !');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
