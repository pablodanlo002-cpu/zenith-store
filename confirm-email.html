<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation Email | Zenith Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .box {
            background: #111;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .logo img {
            height: 50px;
            margin-bottom: 2rem;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 2rem;
        }

        .success {
            color: #10b981;
        }

        .error {
            color: #ef4444;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        p {
            color: #888;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn {
            padding: 1rem 2rem;
            background: #8b5cf6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #7c3aed;
        }

        .loading {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top-color: #8b5cf6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">
            <img src="images/logo/logo.png" alt="Zenith Store">
        </div>

        <div id="loading" style="display: block;">
            <div class="loading"></div>
            <p style="margin-top: 1.5rem;">Vérification en cours...</p>
        </div>

        <div id="success" style="display: none;">
            <div class="icon success">
                <i class="fas fa-check-circle"></i>
            </div>
            <h1>Email confirmé !</h1>
            <p>Ton adresse email a été vérifiée avec succès.<br>Tu peux maintenant te connecter.</p>
            <a href="login.html" class="btn">Se connecter</a>
        </div>

        <div id="error" style="display: none;">
            <div class="icon error">
                <i class="fas fa-times-circle"></i>
            </div>
            <h1>Lien invalide</h1>
            <p>Ce lien de confirmation est invalide ou a expiré.</p>
            <a href="index.html" class="btn">Retour à l'accueil</a>
        </div>
    </div>

    <script>
        // Récupérer le token depuis l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        setTimeout(() => {
            if (!token) {
                showError();
                return;
            }

            // Récupérer les utilisateurs
            const users = JSON.parse(localStorage.getItem('users')) || [];
            
            // Trouver l'utilisateur avec ce token
            const userIndex = users.findIndex(u => u.confirmationToken === token);
            
            if (userIndex === -1) {
                showError();
                return;
            }

            // Marquer l'email comme confirmé
            users[userIndex].emailConfirmed = true;
            users[userIndex].confirmedAt = new Date().toISOString();
            delete users[userIndex].confirmationToken;
            
            localStorage.setItem('users', JSON.stringify(users));
            
            showSuccess();
        }, 1500); // Simule un délai de vérification

        function showSuccess() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('success').style.display = 'block';
        }

        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        }
    </script>
</body>
</html>
