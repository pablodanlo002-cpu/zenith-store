<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | Zenith Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .register-box {
            background: #111;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo img {
            height: 40px;
            margin-bottom: 0.5rem;
        }

        .logo h1 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 2rem;
            text-align: center;
            color: #8b5cf6;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #aaa;
        }

        input {
            width: 100%;
            padding: 0.9rem;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #8b5cf6;
        }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: #8b5cf6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }

        .btn-primary:hover {
            background: #7c3aed;
        }

        .links {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
        }

        .links a {
            color: #8b5cf6;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <script src="notifications.js"></script>
    <div class="register-box">
        <div class="logo">
            <img src="images/logo/logo.png" alt="Zenith Store" style="height: 40px; margin-bottom: 0.5rem;">
            <h1 style="font-size: 1.2rem; font-weight: 700;">ZENITH STORE</h1>
        </div>

        <h2>Inscription</h2>

        <form id="registerForm" onsubmit="register(event)">
            <div class="form-group">
                <label>Nom</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" minlength="6" required>
            </div>

            <div class="form-group">
                <label>Confirmer le mot de passe</label>
                <input type="password" id="confirmPassword" minlength="6" required>
            </div>

            <button type="submit" class="btn-primary">S'inscrire</button>
        </form>

        <div class="links">
            <p>Déjà un compte ? <a href="login.html">Se connecter</a></p>
            <p style="margin-top: 1rem;"><a href="index.html">Retour à l'accueil</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="email-config.js"></script>
    <script>
        // Initialiser EmailJS
        window.onload = function() {
            if (isEmailJSConfigured()) {
                initEmailJS();
            }
        };

        async function register(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.toLowerCase().trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                showNotification('Erreur', 'Les mots de passe ne correspondent pas', 'error');
                return;
            }
            
            const users = JSON.parse(localStorage.getItem('users')) || [];
            
            // Vérifier si l'email existe déjà
            if (users.find(u => u.email === email)) {
                showNotification('Email déjà utilisé', 'Cet email est déjà associé à un compte', 'error');
                return;
            }
            
            // Générer un token de confirmation
            const confirmationToken = generateConfirmationToken();
            
            // Créer le nouvel utilisateur
            const newUser = {
                id: Date.now(),
                name,
                email,
                password,
                provider: 'email',
                emailConfirmed: false, // Email pas encore confirmé
                confirmationToken: confirmationToken,
                createdAt: new Date().toISOString()
            };
            
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));
            
            // Envoyer l'email de confirmation si EmailJS est configuré
            if (isEmailJSConfigured()) {
                const sent = await sendConfirmationEmail(email, name, confirmationToken);
                if (sent) {
                    showNotification('Compte créé !', 'Un email de confirmation a été envoyé à ' + email + '\n\nClique sur le lien dans l\'email pour activer ton compte.', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                } else {
                    showNotification('Compte créé', 'L\'email n\'a pas pu être envoyé.\n\nVotre compte a été activé automatiquement.', 'warning');
                    newUser.emailConfirmed = true;
                    localStorage.setItem('users', JSON.stringify(users));
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                }
            } else {
                // Mode développement : activer automatiquement
                showNotification('Compte créé', 'EmailJS n\'est pas configuré.\n\nVotre compte a été activé automatiquement.', 'warning');
                newUser.emailConfirmed = true;
                localStorage.setItem('users', JSON.stringify(users));
                localStorage.setItem('currentUser', JSON.stringify(newUser));
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
                return;
            }
        }
    </script>
</body>
</html>
